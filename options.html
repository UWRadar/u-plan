<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U Plan 设置</title><link rel="stylesheet" href="options.css"></head>
<body><main><p class="eyebrow">华大课友 · U PLAN</p><h1>教授评分设置</h1><p>课程课评与教授评分分别标注来源。无需提供 NetID、密码或课表。</p><label for="campus">UW 校区 <select id="campus"><option value="seattle">UW Seattle</option><option value="bothell">UW Bothell</option><option value="tacoma">UW Tacoma</option></select></label><p>按所选校区匹配教授，避免同名教师配错学校。</p><label><input type="checkbox" id="live-ratings">启用 RMP 实时查询</label><p>启用后，打开 MyPlan 课程页面或点击教授按钮时，插件会将该教授姓名和 UW 校区发送给 Rate My Professors。结果缓存在本机；官网服务器不参与请求。</p><p>这是可选的实验性接入。RMP 不可用时仍可通过按钮打开原站，评分以原站为准。</p><button id="clear-cache" type="button">清除本机评分缓存</button><p id="status" role="status"></p></main><script src="scripts/options.js" defer></script></body></html>
